<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prova menu da tastiera</title>
<style>
body{font:18px/1.5 system-ui,sans-serif;max-width:720px;margin:48px auto;padding:0 24px;color:#172234;background:#fff}section{border:1px solid #adb5c2;border-radius:8px;padding:20px;margin:24px 0}.trigger,button{font:inherit;color:#172234;background:#f2f5fa;border:1px solid #677489;border-radius:5px;padding:10px 18px;cursor:pointer;display:inline-block} :focus-visible{outline:3px solid #164ed8;outline-offset:4px}[role=menu]{padding:8px;margin-top:12px;border:1px solid #677489;max-width:220px}[role=menuitem]{display:block;width:100%;text-align:left;margin:4px 0}[hidden]{display:none!important}output{display:block;margin:20px 0}
</style>
<h1>Prova menu da tastiera</h1>
<p>Due menu di azioni indipendenti. Ogni azione aggiorna il risultato qui sotto.</p>
<button id="start">Inizio</button>
<section><h2>Menu Aurora</h2><button class="trigger" id="aurora" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-aurora">Azioni Aurora</button><div role="menu" id="menu-aurora" aria-labelledby="aurora" hidden><button role="menuitem" tabindex="-1">Salva</button><button role="menuitem" tabindex="-1">Duplica</button></div></section>
<section><h2>Menu Boreale</h2><div class="trigger" id="boreale" role="button" tabindex="0" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-boreale">Azioni Boreale</div><div role="menu" id="menu-boreale" aria-labelledby="boreale" hidden><button role="menuitem" tabindex="-1">Salva</button><button role="menuitem" tabindex="-1">Duplica</button></div></section>
<button id="end">Fine</button>
<output role="status" id="result">Nessuna azione selezionata.</output>
<script>
for(const name of ['aurora','boreale']){
 const trigger=document.getElementById(name),menu=document.getElementById('menu-'+name),items=[...menu.querySelectorAll('[role=menuitem]')];
 function close(restore=false){menu.hidden=true;trigger.setAttribute('aria-expanded','false');if(restore)trigger.focus()}
 function open(last=false){menu.hidden=false;trigger.setAttribute('aria-expanded','true');items[last?items.length-1:0].focus()}
 trigger.addEventListener('click',()=>menu.hidden?open():close(true));
 if(name==='aurora')trigger.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();open(e.key==='ArrowUp')}});
 menu.addEventListener('keydown',e=>{const i=items.indexOf(document.activeElement);if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close(true)}else if(e.key==='Tab'){e.preventDefault();close();(e.shiftKey?trigger:document.getElementById(name==='aurora'?'boreale':'end')).focus()}else if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();let j=e.key==='Home'?0:e.key==='End'?items.length-1:(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items[j].focus()}});
 items.forEach(item=>item.addEventListener('click',()=>{document.getElementById('result').textContent=trigger.textContent+': '+item.textContent;close(true)}));
 menu.addEventListener('focusout',e=>{if(!menu.contains(e.relatedTarget))close()});
}
</script>
</html>
